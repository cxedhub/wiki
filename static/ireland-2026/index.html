  var msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function b64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function get(store) { try { return window[store].getItem("ie26.k"); } catch (e) { return null; } }
  function put(store, v) { try { window[store].setItem("ie26.k", v); } catch (e) {} }
  function drop() { try { localStorage.removeItem("ie26.k"); sessionStorage.removeItem("ie26.k"); } catch (e) {} }

  var data = bytes(P.data), iv = data.slice(0, 12), ct = data.slice(12);

  function open(rawB64) {

      .then(b64);
